[package]
name = "aspen"
version = "1.0.0"
edition = "2021"
description = "Aspen - GitHub Actions Carbon Estimator"
repository = "https://github.com/DigitalPebble/aspen"
homepage = "https://github.com/DigitalPebble/aspen"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
once_cell = "1"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
