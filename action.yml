name: 'Ginkgo - GitHub Actions Carbon Estimator'
description: 'Estimate the environmental impact of GitHub Actions for your organization'
author: 'DigitalPebble'

inputs:
  github_token:
    description: 'GitHub token with organization Administration (read) permission'
    required: true
  organization:
    description: 'GitHub organization name'
    required: true
  output_path:
    description: 'Path where the carbon estimate report will be saved'
    required: false
    default: 'carbon-estimate.json'
  version:
    description: >-
      Ginkgo release to download (e.g. 0.2.0, or "latest"). By default the release
      matching the action ref is used; other refs build from source.
    required: false
    default: ''

outputs:
  report-path:
    description: 'Path to the generated carbon estimate report'
    value: ${{ steps.report.outputs.report-path }}
  total_co2eq_g:
    description: 'Total estimated emissions in grams of CO2 equivalent'
    value: ${{ steps.ginkgo.outputs.total_co2eq_g }}
  total_energy_wh:
    description: 'Total estimated energy usage in watt-hours'
    value: ${{ steps.ginkgo.outputs.total_energy_wh }}

runs:
  using: 'composite'
  steps:
    # Downloads and verifies the prebuilt binary; `bin` is empty when the
    # binary has to be built from source (branch/SHA refs, unsupported runners).
    - name: Install ginkgo
      id: install
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        INPUT_VERSION: ${{ inputs.version }}
        GITHUB_TOKEN: ${{ github.token }}
      run: bash "$ACTION_PATH/scripts/install-binary.sh"

    - name: Install Rust toolchain
      if: steps.install.outputs.bin == ''
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Build ginkgo
      if: steps.install.outputs.bin == ''
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: cargo build --release --manifest-path "$ACTION_PATH/Cargo.toml"

    # Inputs are passed through the environment, never interpolated into the
    # script, to avoid script injection and to keep the token out of argv.
    # The binary reads INPUT_* and appends to GITHUB_STEP_SUMMARY / GITHUB_OUTPUT.
    - name: Run ginkgo
      id: ginkgo
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        GINKGO_BIN: ${{ steps.install.outputs.bin }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_ORGANIZATION: ${{ inputs.organization }}
        INPUT_OUTPUT_PATH: ${{ inputs.output_path }}
      run: '"${GINKGO_BIN:-$ACTION_PATH/target/release/ginkgo}"'

    - name: Set output
      id: report
      shell: bash
      env:
        INPUT_OUTPUT_PATH: ${{ inputs.output_path }}
      run: echo "report-path=$INPUT_OUTPUT_PATH" >> "$GITHUB_OUTPUT"

branding:
  icon: 'download-cloud'
  color: 'green'
