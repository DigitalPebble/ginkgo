name: 'Aspen - GitHub Actions Carbon Estimator'
description: 'Estimate the environmental impact of GitHub Actions for a repository or an organisation.'
author: 'DigitalPebble'

branding:
  icon: 'download-cloud'
  color: 'green'

inputs:
  github_token:
    description: >-
      GitHub token. With the default `jobs` source the built-in token is enough (needs
      `actions: read`). With the `billing` source it needs organization Administration (read).
    required: false
    default: ${{ github.token }}
  source:
    description: >-
      Where the usage data comes from: `jobs` (workflow jobs of this repository) or
      `billing` (organization billing API, filtered to this repository).
    required: false
    default: 'jobs'
  days:
    description: 'Number of days of usage to analyse, up to today (both sources, so their figures are comparable)'
    required: false
    default: '30'
  output_path:
    description: 'Path where the carbon estimate report will be saved'
    required: false
    default: 'carbon-estimate.json'
  badge_path:
    description: >-
      Path where a shields.io endpoint badge (JSON) with the total emissions will be written.
      Silver with the `jobs` source, gold with the more accurate `billing` source. Empty to skip.
    required: false
    default: 'badge.json'
  publish_badge:
    description: >-
      Commit the badge file to `badge_branch` of this repository. Needs `contents: write`
      on the job. Uses the built-in token, not `github_token`.
    required: false
    default: 'false'
  badge_branch:
    description: >-
      Branch the badge file is committed to when `publish_badge` is true. Created as an
      orphan branch if missing. The file keeps the name of `badge_path`.
    required: false
    default: 'badges'
  version:
    description: >-
      Aspen release tag to download (e.g. v0.3.0, or "latest"). By default the release
      matching the action ref is used; other refs build from source.
    required: false
    default: ''

outputs:
  report-path:
    description: 'Path to the generated carbon estimate report'
    value: ${{ steps.report.outputs.report-path }}
  badge-path:
    description: 'Path to the generated shields.io endpoint badge'
    value: ${{ steps.report.outputs.badge-path }}
  total_co2eq_g:
    description: 'Total estimated emissions in grams of CO2 equivalent'
    value: ${{ steps.aspen.outputs.total_co2eq_g }}
  total_energy_wh:
    description: 'Total estimated energy usage in watt-hours'
    value: ${{ steps.aspen.outputs.total_energy_wh }}
  total_water_cooling_l:
    description: 'Total estimated water consumed by data centre cooling, in litres'
    value: ${{ steps.aspen.outputs.total_water_cooling_l }}
  total_water_electricity_l:
    description: 'Total estimated water consumed to generate the electricity used, in litres'
    value: ${{ steps.aspen.outputs.total_water_electricity_l }}

runs:
  using: 'composite'
  steps:
    # Downloads and verifies the prebuilt binary; `bin` is empty when the
    # binary has to be built from source (branch/SHA refs, unsupported runners).
    - name: Install aspen
      id: install
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ACTION_REF: ${{ github.action_ref }}
        ACTION_REPOSITORY: ${{ github.action_repository }}
        INPUT_VERSION: ${{ inputs.version }}
        GITHUB_TOKEN: ${{ github.token }}
      run: bash "$ACTION_PATH/scripts/install-binary.sh"

    - name: Install Rust toolchain
      if: steps.install.outputs.bin == ''
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable

    - name: Build aspen
      if: steps.install.outputs.bin == ''
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: cargo build --release --manifest-path "$ACTION_PATH/Cargo.toml"

    # Inputs are passed through the environment, never interpolated into the
    # script, to avoid script injection and to keep the token out of argv.
    # The binary reads INPUT_* and appends to GITHUB_STEP_SUMMARY / GITHUB_OUTPUT.
    - name: Run aspen
      id: aspen
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        ASPEN_BIN: ${{ steps.install.outputs.bin }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_REPOSITORY: ${{ github.repository }}
        INPUT_SOURCE: ${{ inputs.source }}
        INPUT_DAYS: ${{ inputs.days }}
        INPUT_OUTPUT_PATH: ${{ inputs.output_path }}
        INPUT_BADGE_PATH: ${{ inputs.badge_path }}
      run: '"${ASPEN_BIN:-$ACTION_PATH/target/release/aspen}"'

    - name: Set output
      id: report
      shell: bash
      env:
        INPUT_OUTPUT_PATH: ${{ inputs.output_path }}
        INPUT_BADGE_PATH: ${{ inputs.badge_path }}
      run: |
        echo "report-path=$INPUT_OUTPUT_PATH" >> "$GITHUB_OUTPUT"
        echo "badge-path=$INPUT_BADGE_PATH" >> "$GITHUB_OUTPUT"

    - name: Publish badge
      if: inputs.publish_badge == 'true'
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        BADGE_PATH: ${{ inputs.badge_path }}
        BADGE_BRANCH: ${{ inputs.badge_branch }}
        GITHUB_TOKEN: ${{ github.token }}
      run: bash "$ACTION_PATH/scripts/publish-badge.sh"
